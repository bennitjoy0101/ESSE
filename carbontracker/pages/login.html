<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In - Carbon Footprint Tracker</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/theme.js"></script>
</head>
<body>

<div style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--color-bg);">
  <div class="card" style="width:360px;">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="sidebar-logo-icon" style="margin:0 auto 10px;">🌱</div>
      <div class="sidebar-logo-text" style="color:var(--color-primary-dark); font-weight:700;">CARBON FOOTPRINT TRACKER</div>
    </div>

    <div id="authTitle" style="font-weight:700; font-size:18px; margin-bottom:16px; text-align:center;">Log In</div>

    <div id="errorMsg" style="display:none; background:#ffebee; color:var(--color-accent-red); padding:10px; border-radius:8px; font-size:13px; margin-bottom:14px;"></div>

    <div style="margin-bottom:14px;">
      <div style="font-size:13px; margin-bottom:4px;">Email</div>
      <input id="emailInput" type="email" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--color-border);">
    </div>

    <div style="margin-bottom:18px;">
      <div style="font-size:13px; margin-bottom:4px;">Password</div>
      <input id="passwordInput" type="password" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--color-border);">
    </div>

    <button id="submitBtn" class="btn btn-primary btn-block" style="margin-bottom:12px;">Log In</button>
    <button id="googleBtn" class="btn btn-outline btn-block" style="margin-bottom:16px;">Continue with Google</button>

    <div style="text-align:center; font-size:13px; color:var(--color-text-muted);">
      <span id="toggleText">Don't have an account?</span>
      <a href="#" id="toggleModeLink" style="color:var(--color-primary); font-weight:600; text-decoration:none;">Sign Up</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
